project_id = "tivlllahuykbfnawwhba"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"

# Supabase n'honore `redirectTo` que si l'URL est listée ici. Sans cela il
# retombe silencieusement sur `site_url` : le lien de réinitialisation
# atterrissait sur la home, avec les jetons dans le fragment et aucun
# formulaire pour les exploiter.
# Ce fichier ne pilote que l'environnement local — la même liste doit être
# saisie dans le dashboard (Authentication → URL Configuration).
additional_redirect_urls = [
  "http://localhost:3000/reset-password",
  "http://localhost:3001/reset-password",
  "https://www.gcfi-rca.com/reset-password",
]

[auth.email]
enable_confirmations = true

# Verrouillage par compte après 5 échecs de connexion — voir la migration
# 20260913000100_password_signin_lockout.sql.
#
# Cette section ne vaut que pour l'environnement local : le hook
# « Password Verification Attempt » n'est proposé que sur les offres Teams et
# Enterprise, donc sur Free/Pro la fonction reste inerte en production tant que
# le hook n'est pas enregistré dans le dashboard (Authentication → Hooks).
[auth.hook.password_verification_attempt]
enabled = true
uri = "pg-functions://postgres/public/hook_password_verification_attempt"

# SMTP local : `supabase start` route tout vers Inbucket (port 54324), donc
# aucun email ne part vraiment en développement. La configuration SMTP de
# production se fait dans le dashboard, pas ici — voir supabase/EMAIL_SETUP.md.
